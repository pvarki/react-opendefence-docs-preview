<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview not found</title>
<p id="m" style="font:16px system-ui;margin:2rem">This preview does not exist. See the <a href="https://github.com/pvarki/react-opendefence-docs/pulls">open pull requests</a>.</p>
<script>
  var m = document.getElementById("m");
  var p = location.pathname.match(/^\/react-opendefence-docs-preview\/pr-\d+\//);
  if (p) {
    m.hidden = true;
    fetch(p[0] + "404.html")
      .then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        m.hidden = false;
      });
  }
</script>
